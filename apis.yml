aid: trust3-ai
name: Trust3 AI
description: >-
  Trust3 AI is the agent-first trust layer for the enterprise, founded by the
  creators of Apache Ranger and Apache Atlas (the team behind Privacera).
  The platform discovers every AI agent running across platforms like
  Databricks and Microsoft Copilot Studio, scores each one with a 1.0-10.0
  Trust Score, evaluates agents against policy packs for NERC CIP, the EU AI
  Act, FERC, and internal AI governance, and gates new agents through
  structured approval workflows - with MCP and A2A protocol-layer security and
  the GIA governance assistant built in. Programmatic access uses scoped API
  keys: AI Assets Collectors authenticate to the Trust3 API server with a
  Trust3 API key, and external AI clients connect to the hosted MCP server at
  api.na.trust3ai.com/mcp with an MCP (read) scoped key. Backed by Insight
  Partners, Sapphire Ventures, Battery Ventures, Accel, Cervin Ventures, and
  Point72 Ventures ($63.5M raised).
