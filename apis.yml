apis:
- name: Trust3 AI Governance API
  description: >-
    The Trust3 API server is the public AI Governance API edge of the Trust3
    control plane. AI Assets Collectors running in the customer data plane
    authenticate every request with a Trust3 API key (AI_GOVERNANCE_API_KEY);
    the API server validates the key and routes allowed calls to Trust3
    backend services (inventory, policies, scoring, workflows). The same edge
    hosts the official Trust3 MCP server at /mcp for external AI clients using
    MCP (read) scoped keys. No public REST API reference is published yet -
    the docs site's generic API page is a provider-flagged placeholder.
  humanURL: https://docs.trust3ai.com/platform-concepts/control-data-plane.html
  baseURL: https://api.na.trust3ai.com
